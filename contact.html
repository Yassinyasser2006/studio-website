<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact us</title>
        <link rel = "stylesheet" href="css/styles.css">
    </head>
    <body>
        <header class="site-header">
            <a class="logo" href="index.html">Studio</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a class="active" href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>
        <main class="container">   
            <section class="hero">
                <h1>Want anything? Contact us</h1>
                <p>Send us this form below:-</p>
            </section>
            <form class="card">
                <label for="name">Name:</label>
                <input type="text" id="name">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
                <label for="number">Choose a number between 1 and 100:</label>
                <input type="number" id="number" name="number" min="1" max="100">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date">
                <label>
                    <input type="radio" name="contact" value="email">
                    E-mail
                </label>
                <label>
                    <input type="radio" name="contact" value="phone">
                    Phone
                </label>
                <label>
                    <input type="checkbox" name="interest" value="html">
                    HTML
                </label>
                <label>
                    <input type="checkbox" name="interest" value="css">
                    CSS
                </label>
                <label>
                    <input type="checkbox" name="interest" value="java">
                    Java
                </label>
                <label for="subject">Subject:</label>
                <select id="subject" name="subject">
                    <option value="question">General Question</option>
                    <option value="feedback">Feedback</option>
                    <option value="technical">Technical Problems</option>
                    <option value="other">Other</option>
                </select>
                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>
                <button type="submit" class="btn">Send message</button>
            </form>
        </main>
        <footer class="site-footer">
            <div class="container">In-Lab Practice (Studio) © 2026</div>
        </footer>
    </body>
</html>
